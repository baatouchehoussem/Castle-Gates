<style>

.gate-leaf:first-child{transform-origin:left center;border-radius:90% 0 0 0 / 14% 0 0 0}
.gate-leaf:last-child{transform-origin:right center;animation-name:gate-open-right;animation-delay:.15s;border-radius:0 90% 0 0 / 0 14% 0 0}

.gate-leaf:after{inset:43% 14% 10%;border-radius:45% 45% 0 0 / 16% 16% 0 0}
